apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: document-service
  template:
    metadata:
      labels:
        app: document-service
    spec:
      containers:
        - name: document-service
          image: 192.168.1.10:8083/document-service:latest
          env:
            - name: PORT
              value: "3000"
            - name: DB
              value: "templates"
            - name: MONGO_URL
              value: "mongodb://root:pass@mongo:27017/templates?authSource=admin&w=majority"
            - name: AWS_ENDPOINT_URL
              value: "http://localstack:4566"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: AWS_ACCESS_KEY_ID
              value: "test"
            - name: AWS_SECRET_ACCESS_KEY
              value: "test"
            - name: AWS_S3_BUCKET_NAME
              value: "document-bucket"
          ports:
            - containerPort: 3000
