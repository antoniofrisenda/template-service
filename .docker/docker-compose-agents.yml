services:
  jenkins:
    image: jenkins/jenkins:lts
    restart: always
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home

  agent-golang:
    build:
      context: .
      dockerfile: golang.Dockerfile
    container_name: jenkins-agent-golang
    volumes:
      - jenkins_agent_golang:/var/jenkins
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - jenkins

  agent-docker:
    build:
      context: .
      dockerfile: docker.Dockerfile
    container_name: jenkins-agent-docker
    volumes:
      - jenkins_agent_docker:/var/jenkins
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - jenkins

  agent-kubectl:
    build:
      context: .
      dockerfile: kubectl.Dockerfile
    container_name: jenkins-agent-kubectl
    volumes:
      - jenkins-agent-kubectl:/var/jenkins
      - /mnt/c/Users/andre/.kube/config:/home/jenkins/.kube/config:ro
    environment:
      - JENKINS_URL=http://jenkins:8080
      - JENKINS_AGENT_NAME=agent-k8s
      - JENKINS_SECRET=8580370ce0f0cac4d033e1afb4fb0eea824b29bd87c6ed54435ca6c77ddeab19
      - JENKINS_WEB_SOCKET=true
    depends_on:
      - jenkins

volumes:
  jenkins_home:
  jenkins_agent_golang:
  jenkins_agent_docker:
  jenkins-agent-kubectl: