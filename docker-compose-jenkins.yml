services:
  jenkins:
    image: jenkins/jenkins:lts
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home

  agent-golang:
    build:
      context: .
      dockerfile: Dockerfile.golang
    container_name: jenkins-agent-golang
    depends_on:
      - jenkins

  agent-docker:
    build:
      context: .
      dockerfile: Dockerfile.docker
    container_name: jenkins-agent-docker
    depends_on:
      - jenkins

volumes:
  jenkins_home: